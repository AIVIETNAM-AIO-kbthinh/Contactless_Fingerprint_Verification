[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fpsys"
version = "0.1.0"
description = "Lõi xác thực vân tay không tiếp xúc (contactless fingerprint verification)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "scikit-image",
    "ultralytics",
    "pyyaml",
    "pillow",
    "pillow-heif",  # ảnh HEIC của iPhone
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ablation = ["fingerprint-enhancer"]
embed = ["onnxruntime"]
server = ["fastapi", "uvicorn", "python-multipart", "cryptography", "httpx"]

[project.scripts]
fpsys = "fpsys.cli:main"

[tool.setuptools.packages.find]
include = ["fpsys*", "server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "yolo11n_640", "data", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E741", "B905"]
